# Controllo programmato della coda: avvia le estrazioni in attesa e recupera quelle
# rimaste ferme (avvio perso, runner interrotto). Di norma la coda avanza da sola.
name: Coda delle estrazioni

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: coda
  cancel-in-progress: false

jobs:
  coda:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "requests>=2.31"
      - name: Assegnazione e avvio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RAMO_PRINCIPALE: ${{ github.event.repository.default_branch }}
        run: python -m piattaforma.coda
