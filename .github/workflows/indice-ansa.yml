# Ogni giorno registra le uscite ANSA (indirizzo, titolo, data, sezione, regione; nessun testo).
name: Indice ANSA

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indice-ansa
  cancel-in-progress: false

jobs:
  indice:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper_testate/requirements.txt
      - run: python -m pip install --quiet -r scraper_testate/requirements.txt
      - name: Aggiornamento dell'indice
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m piattaforma.indice_ansa
