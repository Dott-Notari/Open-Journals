# Collaudo delle fonti dai server di GitHub Actions. Al primo avvio manuale, con
# «aggiorna disponibilità» attivo, decide quali fonti sono utilizzabili online;
# il collaudo settimanale aggiorna solo gli esiti, visibili nell'area docente.
name: Collaudo delle fonti

on:
  workflow_dispatch:
    inputs:
      aggiorna_disponibilita:
        description: Rendi disponibili online le fonti che superano il collaudo (e nascondi le altre)
        type: boolean
        default: true
      fonti:
        description: Chiavi separate da spazi (vuoto = tutte), per esempio "ansa youtube"
        type: string
        default: ""
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

concurrency:
  group: collaudo
  cancel-in-progress: false

jobs:
  collaudo:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Controllo dei parametri
        env:
          FONTI: ${{ inputs.fonti }}
        run: |
          schema='^[a-z0-9_ ]*$'
          [[ "$FONTI" =~ $schema ]] || { echo "elenco delle fonti non valido"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper_testate/requirements.txt
      - name: Dipendenze
        run: |
          python -m pip install --quiet -r scraper_testate/requirements.txt "faster-whisper>=1.0.3"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Collaudo
        env:
          FONTI: ${{ inputs.fonti }}
          AGGIORNA_DISPONIBILITA: ${{ github.event_name == 'workflow_dispatch' && inputs.aggiorna_disponibilita }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m piattaforma.collaudo_online $FONTI
