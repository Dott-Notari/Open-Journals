# Esegue una singola estrazione. Non si avvia a mano: lo avviano la route di Next.js,
# la fine di un'estrazione precedente e il controllo della coda, sempre dopo che
# Supabase ha assegnato l'estrazione (una alla volta per fonte).
name: Estrazione
run-name: Estrazione ${{ inputs.id }}

on:
  workflow_dispatch:
    inputs:
      id:
        description: Identificativo dell'estrazione
        required: true
        type: string
      fonte:
        description: Chiave della testata oppure youtube
        required: true
        type: string

permissions:
  contents: read
  actions: write   # serve solo ad avviare l'estrazione successiva in coda

# la coda su Supabase decide quante estrazioni per testata girano insieme;
# qui si evita solo che la stessa estrazione parta due volte
concurrency:
  group: estrazione-${{ inputs.id }}
  cancel-in-progress: false

jobs:
  estrazione:
    runs-on: ubuntu-24.04
    timeout-minutes: 360   # massimo di GitHub per un job
    steps:
      - name: Controllo dei parametri
        env:
          ESTRAZIONE_ID: ${{ inputs.id }}
          FONTE: ${{ inputs.fonte }}
        run: |
          [[ "$ESTRAZIONE_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "identificativo non valido"; exit 1; }
          [[ "$FONTE" =~ ^[a-z0-9_]{2,30}$ ]] || { echo "fonte non valida"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: python
        with:
          python-version: "3.12"

      # ambiente Python già pronto da un'esecuzione precedente: niente installazioni a ogni avvio
      - name: Ambiente Python in cache
        id: ambiente
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ inputs.fonte == 'youtube' && 'video' || 'testate' }}-${{ hashFiles('scraper_testate/requirements.txt') }}

      - name: Dipendenze (solo se manca la cache)
        if: steps.ambiente.outputs.cache-hit != 'true'
        env:
          FONTE: ${{ inputs.fonte }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --quiet -r scraper_testate/requirements.txt
          if [ "$FONTE" = "youtube" ]; then .venv/bin/python -m pip install --quiet "faster-whisper>=1.0.3"; fi

      - name: Attivazione dell'ambiente
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: ffmpeg per YouTube
        if: inputs.fonte == 'youtube'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: inputs.fonte == 'youtube'
        with:
          deno-version: v2.x

      - name: Modello Whisper in cache
        if: inputs.fonte == 'youtube'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Estrazione
        env:
          ESTRAZIONE_ID: ${{ inputs.id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m piattaforma.esegui_estrazione

      - name: Avvio della prossima estrazione in coda
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RAMO_PRINCIPALE: ${{ github.event.repository.default_branch }}
        run: python -m piattaforma.coda
